name: Publicar servidor de avisos

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install wrangler
        run: npm install --global wrangler@4

      - name: Find or create the KV namespace
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          res=$(curl -s -H "$auth" "$api?per_page=100")
          if [ "$(echo "$res" | jq -r .success)" != "true" ]; then
            echo "::error::Cloudflare recusou a listagem de KV: $(echo "$res" | jq -c '.errors')"
            exit 1
          fi
          id=$(echo "$res" | jq -r '.result[] | select(.title=="biblia-avisos-SUBS") | .id' | head -1)
          if [ -z "$id" ]; then
            res=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" -d '{"title":"biblia-avisos-SUBS"}' "$api")
            if [ "$(echo "$res" | jq -r .success)" != "true" ]; then
              echo "::error::Cloudflare recusou criar o KV: $(echo "$res" | jq -c '.errors')"
              exit 1
            fi
            id=$(echo "$res" | jq -r .result.id)
          fi
          sed -i "s/KV_ID/$id/" wrangler.toml

      - name: Deploy
        run: |
          if ! wrangler deploy > deploy.log 2>&1; then
            cat deploy.log
            echo "::error::Falha ao publicar: $(grep -iE 'error|✘' deploy.log | head -3 | tr '\n' ' ')"
            exit 1
          fi
          cat deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "{\"api\":\"$url\"}" > ../push-config.json
          echo "Servidor publicado em $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the server address for the app
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-config.json
          git diff --cached --quiet || { git commit -m "Atualiza endereço do servidor de avisos"; git push; }
