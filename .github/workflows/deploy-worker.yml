name: Publicar servidor de avisos

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install wrangler
        run: npm install --global wrangler@4

      - name: Find or create the KV namespace
        run: |
          id=$(wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title.endsWith("biblia-avisos-SUBS")||x.title==="biblia-avisos-SUBS");process.stdout.write(n?n.id:"")})')
          if [ -z "$id" ]; then
            wrangler kv namespace create SUBS
            id=$(wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title.endsWith("biblia-avisos-SUBS")||x.title==="biblia-avisos-SUBS");process.stdout.write(n?n.id:"")})')
          fi
          test -n "$id"
          sed -i "s/KV_ID/$id/" wrangler.toml

      - name: Deploy
        run: |
          wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "{\"api\":\"$url\"}" > ../push-config.json
          echo "Servidor publicado em $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the server address for the app
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-config.json
          git diff --cached --quiet || { git commit -m "Atualiza endereço do servidor de avisos"; git push; }
