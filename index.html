<style>

.mo-done{background:var(--wine);color:var(--on-wine);border:1.5px solid var(--wine);border-radius:14px;text-align:center;padding:13px;font-weight:700;font-size:16px;width:100%}
.mo-done.on{background:var(--card);color:var(--wine)}
.notif-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.trow small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.trow input[type=time]{border:1.5px solid var(--wine);color:var(--wine);background:transparent;border-radius:10px;padding:4px 8px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

.switch[aria-checked="true"]{background:#2E9E4F}.switch[aria-checked="true"]::after{left:23px}

.icon-btn.on{color:var(--wine);border-color:var(--wine)}

.page .ph{color:var(--muted);font-size:14px;text-align:center;padding:30px;line-height:1.6}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:90%}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>

<div class="app" id="app"><div class="loading">Carregando a Bíblia…</div></div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<div id="overlay"></div>
<div class="toast" id="toast" hidden></div>

<script>
const BOOKS=[["Gênesis","Gn"],["Êxodo","Êx"],["Levítico","Lv"],["Números","Nm"],["Deuteronômio","Dt"],["Josué","Js"],["Juízes","Jz"],["Rute","Rt"],["1 Samuel","1Sm"],["2 Samuel","2Sm"],["1 Reis","1Rs"],["2 Reis","2Rs"],["1 Crônicas","1Cr"],["2 Crônicas","2Cr"],["Esdras","Ed"],["Neemias","Ne"],["Ester","Et"],["Jó","Jó"],["Salmos","Sl"],["Provérbios","Pv"],["Eclesiastes","Ec"],["Cânticos","Ct"],["Isaías","Is"],["Jeremias","Jr"],["Lamentações","Lm"],["Ezequiel","Ez"],["Daniel","Dn"],["Oseias","Os"],["Joel","Jl"],["Amós","Am"],["Obadias","Ob"],["Jonas","Jn"],["Miqueias","Mq"],["Naum","Na"],["Habacuque","Hc"],["Sofonias","Sf"],["Ageu","Ag"],["Zacarias","Zc"],["Malaquias","Ml"],["Mateus","Mt"],["Marcos","Mc"],["Lucas","Lc"],["João","Jo"],["Atos","At"],["Romanos","Rm"],["1 Coríntios","1Co"],["2 Coríntios","2Co"],["Gálatas","Gl"],["Efésios","Ef"],["Filipenses","Fp"],["Colossenses","Cl"],["1 Tessalonicenses","1Ts"],["2 Tessalonicenses","2Ts"],["1 Timóteo","1Tm"],["2 Timóteo","2Tm"],["Tito","Tt"],["Filemom","Fm"],["Hebreus","Hb"],["Tiago","Tg"],["1 Pedro","1Pe"],["2 Pedro","2Pe"],["1 João","1Jo"],["2 João","2Jo"],["3 João","3Jo"],["Judas","Jd"],["Apocalipse","Ap"]];
const EXTRA_ALIASES={salmo:18,cantares:21,canticodoscanticos:21,canticosdoscanticos:21,cantico:21,oseas:27,miqueas:32,atosdosapostolos:43,jo:42,jn:31};
const VOTD=[[18,23,1],[42,3,16],[49,4,13],[44,8,28],[22,41,10],[19,3,5],[23,29,11],[39,11,28],[18,46,1],[5,1,9],[44,12,2],[42,14,27],[47,5,22],[57,11,1],[18,119,105],[49,4,6],[61,4,8],[18,37,5],[45,13,4],[39,6,33],[24,3,22],[42,8,32],[44,5,8],[18,91,1],[22,40,31],[48,2,8],[58,1,5],[19,16,3],[44,15,13],[18,121,1],[42,15,13]];
const COLORS=[["y","Amarelo"],["g","Verde"],["b","Azul"],["p","Rosa"]];
const MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const WEEKDAYS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];

let BIBLE=null, NORM=null, DEVO=null, devoLoading=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const refName=(b,c,v)=>`${BOOKS[b][0]} ${c}${v?":"+v:""}`;

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem("biblia:"+k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem("biblia:"+k,JSON.stringify(v))}catch(e){}}
};
const photoDB={
  db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open("biblia-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction("fotos").objectStore("fotos").get(k);q.onsuccess=()=>res(q.result||mem["foto:"+k]||null);q.onerror=()=>res(mem["foto:"+k]||null)})}catch(e){return mem["foto:"+k]||null}},
  async set(k,v){mem["foto:"+k]=v;try{const db=await this.open();await new Promise(res=>{const t=db.transaction("fotos","readwrite");v==null?t.objectStore("fotos").delete(k):t.objectStore("fotos").put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}}
};

/* ---------- state ---------- */
const S={tab:"buscar",view:"home",query:"",result:null,filter:"all",
  read:store.get("lastRead",{b:42,c:3}),hlFilter:"all",devDate:new Date(),sel:null};
let highlights=store.get("highlights",{});
const hlKey=(b,c,v)=>`${b}:${c}:${v}`;
document.documentElement.style.setProperty("--fs",store.get("fontSize",18)+"px");

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){toast("Não deu para copiar neste aparelho")}}

/* ---------- search parsing ---------- */
const BOOK_KEYS=BOOKS.map((b,i)=>({i,name:norm(b[0]).replace(/\s+/g,""),abbr:norm(b[1])}));
function findBook(raw,allowPrefix){
  let k=norm(raw).replace(/\s+/g,"").replace(/^i{1,3}(?=[a-z])/,m=>String(m.length));
  if(!k)return -1;
  if(k==="jo")return /^jó/i.test(raw.trim())?17:42;
  if(k==="job")return 17;
  for(const b of BOOK_KEYS)if(b.name===k)return b.i;
  if(k in EXTRA_ALIASES)return EXTRA_ALIASES[k];
  for(const b of BOOK_KEYS)if(b.abbr===k)return b.i;
  if(allowPrefix&&k.length>=2)for(const b of BOOK_KEYS)if(b.name.startsWith(k))return b.i;
  return -1;
}
function parseRef(q){
  const m=q.trim().match(/^([1-3]?\s*[^\d:.,]+?)\s*(\d+)?(?:\s*[:.,\s]\s*(\d+)(?:\s*-\s*(\d+))?)?\s*$/);
  if(!m)return null;
  const b=findBook(m[1],!!m[2]);
  if(b<0)return null;
  const c=m[2]?+m[2]:1, v=m[3]?+m[3]:null, v2=m[4]?+m[4]:null;
  if(c<1||c>BIBLE[b].length)return {b,c:Math.min(Math.max(c,1),BIBLE[b].length),v:null,bad:true};
  const n=BIBLE[b][c-1].length;
  if(v&&(v<1||v>n))return {b,c,v:null,bad:true};
  return {b,c,v,v2:v2&&v2>v?Math.min(v2,n):null};
}
function wordSearch(q){
  if(!NORM){NORM=[];BIBLE.forEach((bk,b)=>bk.forEach((ch,c)=>ch.forEach((t,v)=>NORM.push([b,c+1,v+1,norm(t)]))))}
  const term=norm(q.trim()).replace(/\s+/g," ");
  const re=new RegExp("(^|[^a-z0-9])("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![a-z0-9])","g");
  const hits=[];
  for(const row of NORM){re.lastIndex=0;if(re.test(row[3]))hits.push(row)}
  return {term,re,hits};
}
function markText(text,re){
  const n=norm(text);let out="",last=0;re.lastIndex=0;let m;
  while((m=re.exec(n))){const s=m.index+m[1].length,e=s+m[2].length;out+=esc(text.slice(last,s))+"<mark>"+esc(text.slice(s,e))+"</mark>";last=e;if(m[0].length===0)re.lastIndex++}
  return out+esc(text.slice(last));
}

function b64uToBytes(s){const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushCall(path,body){
  const r=await fetch(PUSH_API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function currentSub(create){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub&&create){const {key}=await (await fetch(PUSH_API+"/vapid")).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(key)})}
  return sub;
}
async function syncPush(n){
  const sub=await currentSub(n.on&&n.mOn);
  if(!sub)return;
  if(!n.on||!n.mOn){await pushCall("/unsubscribe",{subscription:sub.toJSON()}).catch(()=>{});return}
  await pushCall("/subscribe",{subscription:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,morning:n.morning,evening:null});
}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const max=1400,s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);res(cv.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

  S.sel={b,c,v};const h=highlights[hlKey(b,c,v)];S.pick=h?h.c:"y";
  openSheet(`<div class="row"><span class="t">${refName(b,c,v)}</span><span class="hint">Escolha uma cor</span></div>
    <p style="font-family:var(--text);font-size:16px;line-height:1.5;margin:0;color:var(--muted)">${esc(BIBLE[b][c-1][v-1])}</p>
    <div class="colors">${COLORS.map(([k,l])=>`<button class="dot ${k}${S.pick===k?" sel":""}" data-color="${k}" aria-label="${l}"></button>`).join("")}${h?`<button class="dot none" data-act="unmark" aria-label="Tirar destaque">✕</button>`:""}</div>
    <textarea id="hlNote" rows="2" placeholder="Escrever uma anotação (opcional)…">${esc(h?h.note||"":"")}</textarea>
    <div class="actions"><button class="act primary" data-act="savemark">Salvar destaque</button><button class="act" data-copy="${esc(`“${BIBLE[b][c-1][v-1]}” (${refName(b,c,v)})`)}">Copiar</button></div>`);
  document.querySelectorAll(".v.sel").forEach(e=>e.classList.remove("sel"));
  const el=document.querySelector(`.v[data-v="${v}"]`);if(el&&S.tab==="ler")el.classList.add("sel");
}
function pickerSheet(){
  S.pb=S.pb??S.read.b;
  const b=S.pb;
  openSheet(`<div class="row"><span class="t">${BOOKS[b][0]}: escolha o capítulo</span></div>
    <div class="grid-ch">${BIBLE[b].map((_,i)=>`<button class="${S.read.b===b&&S.read.c===i+1?"on":""}" data-open="${b},${i+1}">${i+1}</button>`).join("")}</div>
    <div class="booklist"><div class="label testament">Antigo Testamento</div>${BOOKS.slice(0,39).map((x,i)=>`<button class="${i===b?"on":""}" data-pb="${i}">${x[0]}</button>`).join("")}
    <div class="label testament">Novo Testamento</div>${BOOKS.slice(39).map((x,i)=>`<button class="${i+39===b?"on":""}" data-pb="${i+39}">${x[0]}</button>`).join("")}</div>`);
}
function editionsSheet(){
  const cur=curEd().id;
  openSheet(`<span class="t">Qual livro devocional?</span>
    <div class="stack" style="gap:8px">${eds().map(e=>`<button class="act${e.id===cur?" primary":""}" style="text-align:left" data-ed="${e.id}">${esc(e.name)}</button>`).join("")}</div>
    <div><div class="label" style="margin-bottom:6px">Adicionar livro novo (ex: edição do ano)</div><div class="row"><input class="field" id="edName" placeholder="Nome do livro"><button class="act primary" data-act="added">Adicionar</button></div></div>`);
}
function addRefSheet(){
  openSheet(`<span class="t">Adicionar versículo citado</span>
    <form id="refForm" class="row"><input class="field" id="refIn" placeholder="Ex: Salmos 23:4" autocomplete="off"><button class="act primary" type="submit">Adicionar</button></form>
    <p class="hint" id="refErr" style="margin:0"></p>`);
  setTimeout(()=>$("#refIn")&&$("#refIn").focus(),50);
}
function fontSheet(){
  const cur=store.get("fontSize",18);
  openSheet(`<span class="t">Tamanho da letra</span><div class="chips">${[16,18,20,23].map((s,i)=>`<button class="chip${cur===s?" on":""}" data-fs="${s}" style="font-size:${13+i*2}px">${["Pequena","Normal","Grande","Maior"][i]}</button>`).join("")}</div>`);
}

/* ---------- render ---------- */
function render(){
  renderTabbar();
  const v=S.tab==="buscar"?(S.view==="verse"?viewVerse():S.view==="word"?viewWord():viewHome()):S.tab==="ler"?viewRead():S.tab==="devocional"?viewDev():viewHighlights();
  $("#app").innerHTML=v;
  if(S.tab==="devocional")fillPhoto();
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button,[data-v],[data-act]");if(!t)return;
  const d=t.dataset;
  if(d.tab)return go(d.tab);
  if(d.open){const [b,c,v]=d.open.split(",").map(Number);closeSheet();S.pb=null;return openChapter(b,c,v)}
  if(d.v&&S.tab==="ler")return markSheet(S.read.b,S.read.c,+d.v);
  if(d.mark){const [b,c,v]=d.mark.split(",").map(Number);return markSheet(b,c,v)}
  if(d.copy)return copy(d.copy);
  if(d.filter){S.filter=d.filter;S.limit=60;return render()}
  if(d.hlf){S.hlFilter=d.hlf;return render()}
  if(d.color){S.pick=d.color;document.querySelectorAll(".dot[data-color]").forEach(x=>x.classList.toggle("sel",x.dataset.color===d.color));return}
  if(d.pb){S.pb=+d.pb;return pickerSheet()}
  if(d.fs){store.set("fontSize",+d.fs);document.documentElement.style.setProperty("--fs",d.fs+"px");return fontSheet()}
  if(d.mode){store.set("devMode",d.mode);return render()}
  if(d.done){const on=!store.get(d.done,false);store.set(d.done,on);if(on)toast("Que bom! Até amanhã.");return render()}
  if(d.sw){if(!notif().on)return enablePush();const n=notif();return updatePush({[d.sw]:!n[d.sw]})}
  if(d.day){S.devDate=new Date(S.devDate.getFullYear(),S.devDate.getMonth(),S.devDate.getDate()+ +d.day);return render()}
  if(d.search){return runSearch(d.search)}
  if(d.ed){store.set("edition",d.ed);closeSheet();toast("Livro trocado");return render()}
  if(d.delref){const k=devKey(),e=store.get(k,{refs:[],note:""});e.refs.splice(+d.delref,1);store.set(k,e);return render()}
  switch(d.act){
    case "close":return closeSheet();
    case "home":S.tab="buscar";S.view="home";S.query="";render();return scrollTo(0,0);
    case "allbooks":S.allBooks=!S.allBooks;return render();
    case "more":S.limit=(S.limit||60)+60;return render();
    case "picker":S.pb=S.read.b;return pickerSheet();
    case "font":return fontSheet();
    case "savemark":{const {b,c,v}=S.sel;highlights[hlKey(b,c,v)]={c:S.pick,note:($("#hlNote").value||"").trim(),t:Date.now()};store.set("highlights",highlights);closeSheet();toast("Destaque salvo");return render()}
    case "unmark":{const {b,c,v}=S.sel;delete highlights[hlKey(b,c,v)];store.set("highlights",highlights);closeSheet();toast("Destaque removido");return render()}
    case "editions":return editionsSheet();
    case "added":{const n=$("#edName").value.trim();if(!n)return toast("Digite o nome do livro");const list=eds();const id="ed"+Date.now();list.push({id,name:n});store.set("editions",list);store.set("edition",id);closeSheet();toast("Livro adicionado");return render()}
    case "addref":return addRefSheet();
    case "bell":S.showNotif=!(S.showNotif??!notif().on);return render();
    case "enablepush":return enablePush();
    case "testpush":try{const sub=await currentSub(false);if(!sub)throw 0;await pushCall("/test",{subscription:sub.toJSON()});toast("Aviso enviado. Deve chegar em instantes.")}catch(e){toast("O aviso de teste falhou. Tente ligar os avisos de novo.")}return;
    case "delphoto":await photoDB.set(devKey(),null);toast("Foto removida");return render();
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")closeSheet();
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches(".v")){ev.preventDefault();markSheet(S.read.b,S.read.c,+ev.target.dataset.v)}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="searchForm"){const q=$("#q").value;if(document.activeElement)document.activeElement.blur();if(q.trim())runSearch(q)}
  if(ev.target.id==="refForm"){const r=parseRef($("#refIn").value);if(!r||r.bad){$("#refErr").textContent="Não reconheci esse versículo. Tente assim: Salmos 23:4";return}
    const k=devKey(),e=store.get(k,{refs:[],note:""});e.refs.push(refName(r.b,r.c,r.v)+(r.v2?"-"+r.v2:""));store.set(k,e);closeSheet();render()}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="devNote"){const k=devKey(),e=store.get(k,{refs:[],note:""});e.note=ev.target.value;store.set(k,e)}
});
document.addEventListener("change",async ev=>{
  if(ev.target.id==="t-m"&&ev.target.value)return updatePush({morning:ev.target.value});
  if(ev.target.id==="photoIn"&&ev.target.files[0]){
    try{const url=await shrink(ev.target.files[0]);await photoDB.set(devKey(),url);toast("Foto salva");render()}
    catch(e){toast("Não consegui abrir essa imagem")}
  }
});

fetch("biblia.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{BIBLE=data;
  const tab=(location.hash||"").slice(1);if(["ler","devocional","destaques"].includes(tab))S.tab=tab;
  const p=new URLSearchParams(location.search).get("p");if(p){S.tab="devocional";store.set("devMode","momento")}
  render()})
  .catch(()=>{$("#app").innerHTML='<div class="empty" style="margin-top:40px">Não consegui carregar o texto da Bíblia. Verifique a internet e abra a página de novo.</div>'});
</script>

<script>
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
